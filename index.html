<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Donnez votre avis au Café Sacré Cœur — 2 minutes, anonyme, ça compte vraiment." />
    <meta name="theme-color" content="#271310" />
    <title>Sondage · Café Sacré Cœur</title>
    <script>
      // Désactiver le clic droit
      document.addEventListener('contextmenu', (e) => e.preventDefault());
      
      // Désactiver les raccourcis clavier de développement
      document.onkeydown = function(e) {
        if(e.keyCode == 123) return false; // F12
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+Shift+C
        if(e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
        if(e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 80vh; text-align: center; color: #271310; opacity: 0.5;">
        Chargement de l'atelier...
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
